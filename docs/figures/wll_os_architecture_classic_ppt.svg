<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48576b"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#223047"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #162033; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #5b6980; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #162033; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #42506a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #64748b; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 17px; font-weight: 600; fill: #2a3448; }
      .layerText { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d5e0ee; stroke-width: 2.2; }
      .chip { fill: #fff4d8; stroke: #e4bd55; stroke-width: 2; }
      .kernel { fill: #ffffff; stroke: #aabbd0; stroke-width: 3; }
      .trap { fill: #eee4f4; stroke: #b49ac4; stroke-width: 2.4; }
      .task { fill: #e6f6e8; stroke: #9fcca8; stroke-width: 2.4; }
      .mm { fill: #efe8fb; stroke: #bea9e2; stroke-width: 2.4; }
      .fs { fill: #e4f2ff; stroke: #99bee0; stroke-width: 2.4; }
      .drv { fill: #fff1dd; stroke: #e3b36f; stroke-width: 2.4; }
      .eval { fill: #fffdf3; stroke: #dccb7f; stroke-width: 2.2; }
      .line { fill: none; stroke: #48576b; stroke-width: 3; marker-end: url(#arrow); }
      .lineDark { fill: none; stroke: #223047; stroke-width: 4; marker-end: url(#arrowDark); }
      .dash { fill: none; stroke: #748196; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text class="title" x="90" y="82">wll_OS 内核架构图</text>
  <text class="subtitle" x="92" y="120">Rust Kernel · RISC-V64 / LoongArch64 · QEMU + VirtIO + 运行时文件系统评测路径</text>

  <!-- left layer labels -->
  <rect x="70" y="180" width="116" height="120" rx="20" fill="#e8f1fb" stroke="#b7c9df" stroke-width="2"/>
  <text class="label" x="93" y="250">用户态</text>
  <rect x="70" y="370" width="116" height="520" rx="24" fill="#1e2b41"/>
  <text class="layerText" x="93" y="620">内核态</text>
  <rect x="70" y="925" width="116" height="74" rx="20" fill="#ecf0f4" stroke="#b9c3cf" stroke-width="2"/>
  <text class="label" x="93" y="970">平台</text>

  <!-- user space -->
  <g filter="url(#shadow)">
    <rect class="card" x="220" y="170" width="1120" height="145" rx="28"/>
  </g>
  <text class="label" x="255" y="213">用户程序与测试入口</text>
  <rect class="chip" x="260" y="235" width="185" height="52" rx="14"/>
  <rect class="chip" x="475" y="235" width="185" height="52" rx="14"/>
  <rect class="chip" x="690" y="235" width="185" height="52" rx="14"/>
  <rect class="chip" x="905" y="235" width="185" height="52" rx="14"/>
  <text class="text" x="310" y="268">APP 1</text>
  <text class="text" x="525" y="268">APP 2</text>
  <text class="text" x="740" y="268">APP 3</text>
  <text class="text" x="955" y="268">APP 4</text>
  <circle cx="1160" cy="260" r="8" fill="#111827"/>
  <circle cx="1195" cy="260" r="8" fill="#111827"/>
  <circle cx="1230" cy="260" r="8" fill="#111827"/>
  <text class="small" x="255" y="302">libc / BusyBox / iozone / libcbench / lmbench / bounded LTP slice / init harness</text>

  <!-- syscall event -->
  <path class="lineDark" d="M780 315 L780 370"/>
  <rect class="trap" x="500" y="370" width="560" height="78" rx="10" filter="url(#shadow)"/>
  <text class="label" x="585" y="418">时钟中断 / syscall / 异常 / 页故障</text>

  <!-- kernel container -->
  <g filter="url(#shadow)">
    <rect class="kernel" x="220" y="475" width="1320" height="415" rx="34"/>
  </g>
  <text class="label" x="255" y="522">wll_OS Kernel</text>
  <text class="subtitle" x="420" y="522">围绕真实 syscall、任务、内存、文件系统和设备路径组织</text>

  <!-- trap mechanism -->
  <rect class="trap" x="260" y="555" width="1240" height="85" rx="22"/>
  <text class="label" x="295" y="590">陷入与系统调用机制</text>
  <rect class="chip" x="625" y="575" width="190" height="42" rx="8"/>
  <rect class="chip" x="845" y="575" width="190" height="42" rx="8"/>
  <rect class="chip" x="1065" y="575" width="190" height="42" rx="8"/>
  <rect class="chip" x="1285" y="575" width="170" height="42" rx="8"/>
  <text class="mono" x="672" y="602">entry_*</text>
  <text class="mono" x="886" y="602">trap_handler</text>
  <text class="mono" x="1094" y="602">syscall_dispatch</text>
  <text class="mono" x="1310" y="602">return_to_user</text>

  <path class="lineDark" d="M780 448 L780 552"/>
  <path class="line" d="M880 640 L880 670"/>

  <!-- core subsystem cards -->
  <rect class="task" x="260" y="685" width="285" height="160" rx="24"/>
  <text class="label" x="292" y="725">任务与调度</text>
  <text class="text" x="292" y="760">Task / PID / Thread Group</text>
  <text class="text" x="292" y="790">wait queue / timer / signal</text>
  <text class="text" x="292" y="820">clone · execve · wait4 · exit</text>

  <rect class="mm" x="585" y="685" width="285" height="160" rx="24"/>
  <text class="label" x="617" y="725">内存管理</text>
  <text class="text" x="617" y="760">page table / frame allocator</text>
  <text class="text" x="617" y="790">VMA / ELF loader / heap</text>
  <text class="text" x="617" y="820">brk · mmap · shm · mprotect</text>

  <rect class="fs" x="910" y="685" width="285" height="160" rx="24"/>
  <text class="label" x="942" y="725">文件系统</text>
  <text class="text" x="942" y="760">VFS / FD table / MemFS</text>
  <text class="text" x="942" y="790">ext4 runtime volume / VFAT</text>
  <text class="text" x="942" y="820">pipe · socket · pseudo device</text>

  <rect class="drv" x="1235" y="685" width="265" height="160" rx="24"/>
  <text class="label" x="1267" y="725">设备与 HAL</text>
  <text class="text" x="1267" y="760">polyhal / arch config</text>
  <text class="text" x="1267" y="790">VirtIO blk / net</text>
  <text class="text" x="1267" y="820">MMIO for RV · PCI for LA</text>

  <path class="dash" d="M545 765 L582 765"/>
  <path class="dash" d="M870 765 L907 765"/>
  <path class="dash" d="M1195 765 L1232 765"/>

  <!-- platform -->
  <rect x="220" y="925" width="1320" height="74" rx="22" fill="#172033"/>
  <text class="layerText" x="255" y="970">QEMU virt / target arch</text>
  <text class="small" x="545" y="968" fill="#dbe6f5">riscv64gc-unknown-none-elf · loongarch64-unknown-none · sdcard-rv.img / sdcard-la.img · VirtIO blk/net</text>
  <path class="lineDark" d="M1367 845 L1367 922"/>
  <path class="lineDark" d="M1052 845 L1052 922"/>

  <!-- right evidence panel -->
  <g filter="url(#shadow)">
    <rect class="card" x="1600" y="170" width="250" height="720" rx="30"/>
  </g>
  <text class="label" x="1630" y="220">评测证据链</text>
  <text class="small" x="1630" y="252">不靠包装脚本假成功</text>

  <rect class="eval" x="1630" y="300" width="190" height="66" rx="15"/>
  <text class="label" x="1660" y="340">构建</text>
  <text class="small" x="1660" y="360">Makefile</text>
  <rect class="eval" x="1630" y="415" width="190" height="66" rx="15"/>
  <text class="label" x="1660" y="455">运行</text>
  <text class="small" x="1660" y="475">QEMU serial.log</text>
  <rect class="eval" x="1630" y="530" width="190" height="66" rx="15"/>
  <text class="label" x="1660" y="570">判定</text>
  <text class="small" x="1660" y="590">judge-summary</text>
  <rect class="eval" x="1630" y="645" width="190" height="66" rx="15"/>
  <text class="label" x="1660" y="685">归档</text>
  <text class="small" x="1660" y="705">results/ 时间戳</text>

  <rect x="1630" y="770" width="190" height="72" rx="16" fill="#172033"/>
  <text class="layerText" x="1656" y="808">能力边界</text>
  <text class="small" x="1656" y="832" fill="#dbe6f5">bounded LTP slice</text>

  <path class="line" d="M1725 366 L1725 412"/>
  <path class="line" d="M1725 481 L1725 527"/>
  <path class="line" d="M1725 596 L1725 642"/>
  <path class="dash" d="M1540 765 C1570 765 1580 765 1597 765"/>

  <!-- bottom notes -->
  <text class="small" x="90" y="1040">图中模块名对应 os/src 下的 task、mm、fs、syscall、trap、drivers、config 等目录；文件系统评测依赖运行时 ext4/VFAT 镜像，而不是只把脚本塞进内核。</text>
</svg>
