<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#f3f7ff"/>
      <stop offset="100%" stop-color="#eef6f4"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#d8eaff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafaf2"/>
      <stop offset="100%" stop-color="#d8f2e6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efff"/>
      <stop offset="100%" stop-color="#e6dcff"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#ffe5c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d3557" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6f8f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fbd"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #17233c; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #5a6b83; }
      .section { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #1e2a44; }
      .boxTitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #17233c; }
      .boxText { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #526078; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #61708a; }
      .tag { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #2d4f7c; }
      .chip { fill: #ffffff; stroke: #c8d8ee; stroke-width: 2; }
      .line { fill: none; stroke: #5b6f8f; stroke-width: 3.2; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #2f6fbd; stroke-width: 4; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #7f91aa; stroke-width: 2.6; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text x="110" y="92" class="title">wll_OS 内核架构图</text>
  <text x="112" y="132" class="subtitle">Rust 内核 · RISC-V64 / LoongArch64 双架构 · 面向真实评测路径</text>

  <g transform="translate(1470,70)">
    <rect x="0" y="0" width="330" height="64" rx="32" fill="#ffffff" stroke="#d6e2f2" stroke-width="2"/>
    <circle cx="38" cy="32" r="15" fill="#35b779"/>
    <text x="66" y="39" class="tag">QEMU + VirtIO + ext4</text>
  </g>

  <!-- User / evaluation layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="180" width="1220" height="145" rx="28" fill="#ffffff" stroke="#d8e4f3" stroke-width="2"/>
  </g>
  <text x="144" y="224" class="section">用户态与测试入口</text>

  <g transform="translate(145,245)">
    <rect class="chip" x="0" y="0" width="245" height="52" rx="18"/>
    <text x="26" y="33" class="boxText">libc / BusyBox</text>
  </g>
  <g transform="translate(420,245)">
    <rect class="chip" x="0" y="0" width="245" height="52" rx="18"/>
    <text x="25" y="33" class="boxText">benchmark / LTP slice</text>
  </g>
  <g transform="translate(695,245)">
    <rect class="chip" x="0" y="0" width="245" height="52" rx="18"/>
    <text x="28" y="33" class="boxText">init / shell / harness</text>
  </g>
  <g transform="translate(970,245)">
    <rect class="chip" x="0" y="0" width="300" height="52" rx="18"/>
    <text x="25" y="33" class="boxText">Linux / asm-generic ABI 子集</text>
  </g>

  <!-- Kernel container -->
  <g filter="url(#shadow)">
    <rect x="110" y="380" width="1220" height="470" rx="34" fill="url(#kernelGrad)" stroke="#b7ccea" stroke-width="3"/>
  </g>
  <text x="146" y="428" class="section">wll_OS Kernel</text>
  <text x="330" y="428" class="subtitle">系统调用、任务、内存、文件系统与驱动协同</text>

  <!-- Syscall layer -->
  <g transform="translate(145,465)">
    <rect x="0" y="0" width="1150" height="78" rx="22" fill="url(#blueGrad)" stroke="#a9c8ee" stroke-width="2"/>
    <text x="28" y="33" class="boxTitle">系统调用层 syscall/</text>
    <text x="28" y="61" class="boxText">process · fs · mm · signal · net · user · time/misc</text>
  </g>

  <!-- Core modules -->
  <g transform="translate(145,585)">
    <rect x="0" y="0" width="350" height="170" rx="26" fill="url(#greenGrad)" stroke="#a8dcbc" stroke-width="2"/>
    <text x="28" y="40" class="boxTitle">任务与调度 task/</text>
    <text x="28" y="75" class="boxText">Task Control Block</text>
    <text x="28" y="105" class="boxText">线程组 / PID / wait queue</text>
    <text x="28" y="135" class="boxText">timer、signal、futex wait path</text>
  </g>

  <g transform="translate(545,585)">
    <rect x="0" y="0" width="350" height="170" rx="26" fill="url(#purpleGrad)" stroke="#c9bbf0" stroke-width="2"/>
    <text x="28" y="40" class="boxTitle">内存管理 mm/</text>
    <text x="28" y="75" class="boxText">页表 / 物理页分配 / heap</text>
    <text x="28" y="105" class="boxText">地址空间 / VMA / ELF loader</text>
    <text x="28" y="135" class="boxText">brk、mmap、shm、mprotect</text>
  </g>

  <g transform="translate(945,585)">
    <rect x="0" y="0" width="350" height="170" rx="26" fill="url(#orangeGrad)" stroke="#edc992" stroke-width="2"/>
    <text x="28" y="40" class="boxTitle">文件系统 fs/</text>
    <text x="28" y="75" class="boxText">VFS / FD table / MemFS</text>
    <text x="28" y="105" class="boxText">ext4 runtime volume / VFAT</text>
    <text x="28" y="135" class="boxText">pipe、socket、pseudo device</text>
  </g>

  <!-- Foundation row -->
  <g transform="translate(145,785)">
    <rect x="0" y="0" width="350" height="42" rx="17" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <text x="30" y="28" class="boxText">Trap / interrupt / exception</text>
  </g>
  <g transform="translate(545,785)">
    <rect x="0" y="0" width="350" height="42" rx="17" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <text x="30" y="28" class="boxText">HAL: polyhal + arch config</text>
  </g>
  <g transform="translate(945,785)">
    <rect x="0" y="0" width="350" height="42" rx="17" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <text x="30" y="28" class="boxText">Drivers: VirtIO MMIO / PCI Block</text>
  </g>

  <!-- Hardware layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="900" width="1220" height="105" rx="28" fill="#17233c"/>
  </g>
  <text x="146" y="944" style="font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif;font-size:25px;font-weight:800;fill:#ffffff;">运行平台与外部设备</text>
  <text x="146" y="978" style="font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif;font-size:19px;font-weight:500;fill:#c7d6ec;">QEMU virt · riscv64gc-unknown-none-elf / loongarch64-unknown-none · VirtIO blk/net · sdcard-rv.img / sdcard-la.img</text>

  <!-- Evidence chain side panel -->
  <g filter="url(#shadow)">
    <rect x="1400" y="180" width="390" height="825" rx="34" fill="#ffffff" stroke="#d8e4f3" stroke-width="2"/>
  </g>
  <text x="1440" y="228" class="section">评测证据链</text>
  <text x="1440" y="262" class="boxText">以真实串口日志和 parser 输出为准</text>

  <g transform="translate(1440,315)">
    <rect x="0" y="0" width="310" height="76" rx="22" fill="#f2f7ff" stroke="#c9daf3" stroke-width="2"/>
    <text x="28" y="32" class="boxTitle">构建</text>
    <text x="28" y="58" class="boxText">Makefile / fixed Rust toolchain</text>
  </g>
  <g transform="translate(1440,440)">
    <rect x="0" y="0" width="310" height="76" rx="22" fill="#f2fbf6" stroke="#bfdfcc" stroke-width="2"/>
    <text x="28" y="32" class="boxTitle">运行</text>
    <text x="28" y="58" class="boxText">QEMU serial.log</text>
  </g>
  <g transform="translate(1440,565)">
    <rect x="0" y="0" width="310" height="76" rx="22" fill="#fff7eb" stroke="#ecd0a0" stroke-width="2"/>
    <text x="28" y="32" class="boxTitle">判定</text>
    <text x="28" y="58" class="boxText">judge-summary.json</text>
  </g>
  <g transform="translate(1440,690)">
    <rect x="0" y="0" width="310" height="76" rx="22" fill="#f6f2ff" stroke="#d1c1f3" stroke-width="2"/>
    <text x="28" y="32" class="boxTitle">归档</text>
    <text x="28" y="58" class="boxText">results/&lt;timestamp&gt;/</text>
  </g>

  <g transform="translate(1440,835)">
    <rect x="0" y="0" width="310" height="105" rx="22" fill="#17233c"/>
    <text x="26" y="38" style="font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif;font-size:23px;font-weight:800;fill:#ffffff;">当前能力边界</text>
    <text x="26" y="69" style="font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif;font-size:17px;font-weight:500;fill:#c7d6ec;">bounded LTP slice</text>
    <text x="26" y="94" style="font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif;font-size:17px;font-weight:500;fill:#c7d6ec;">非完整 Linux 内核</text>
  </g>

  <!-- Arrows main -->
  <path d="M720 325 C720 345 720 355 720 378" class="lineBlue"/>
  <path d="M720 543 C720 560 720 568 720 582" class="lineBlue"/>
  <path d="M320 755 C320 770 320 773 320 782" class="line"/>
  <path d="M720 755 C720 770 720 773 720 782" class="line"/>
  <path d="M1120 755 C1120 770 1120 773 1120 782" class="line"/>
  <path d="M720 850 C720 870 720 880 720 898" class="lineBlue"/>

  <!-- Cross-module relations -->
  <path d="M495 670 C515 670 525 670 542 670" class="dash"/>
  <path d="M895 670 C915 670 925 670 942 670" class="dash"/>
  <path d="M1120 827 C1120 865 1120 874 1120 898" class="line"/>

  <!-- Side panel arrows -->
  <path d="M1595 391 L1595 437" class="line"/>
  <path d="M1595 516 L1595 562" class="line"/>
  <path d="M1595 641 L1595 687" class="line"/>
  <path d="M1330 955 C1362 955 1370 955 1397 955" class="dash"/>

  <!-- Kernel to evidence -->
  <path d="M1330 615 C1360 615 1370 615 1397 615" class="dash"/>

  <!-- Footer -->
  <text x="110" y="1042" class="small">建议插入 PPT 时使用 SVG 原图；如需导出 PNG，建议 1920×1080 或 3840×2160。</text>
</svg>
