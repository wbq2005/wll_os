[package]
name = "polyhal-trap"
version = "0.4.0"
edition = "2021"
description = "This crate provides the trap handling interface for multiple platforms."
authors = ["Byte-OS Team"]
license = "MIT"
repository = "https://github.com/Byte-OS/polyhal"

[dependencies]
log = "0.4"
polyhal = "0.4"
polyhal-macro = "0.4"
bitflags = "2.4"

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.13"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52"
x86_64 = "0.15"
multiboot = "0.8"
raw-cpuid = "11"

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "9.4"
tock-registers = "0.8"

[target.'cfg(target_arch = "loongarch64")'.dependencies]
loongArch64 = "0.2"
